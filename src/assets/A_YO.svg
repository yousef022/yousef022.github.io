<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!-- single tile (background + border in one) -->
  <rect x="0.5" y="0.5" width="95" height="95" rx="24"
        fill="#101522" stroke="rgba(255,255,255,0.18)"/>

  <!-- Y -->
  <path d="M30 30l18 20 18-20"
        fill="none" stroke="#7a5cff" stroke-width="8"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M48 50v18"
        fill="none" stroke="#7a5cff" stroke-width="8"
        stroke-linecap="round"/>

  <!-- O -->
  <circle cx="66" cy="66" r="10"
          fill="none" stroke="#e7eaf1" stroke-width="6" opacity="0.95"/>
</svg>
